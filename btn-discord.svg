      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="236" height="51" rx="25.5" fill="url(#bg)"/>

  <rect x="2" y="2" width="236" height="51" rx="25.5"
