<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <mask id="gridMask">
      <rect width="1280" height="320" fill="white"/>
      <rect width="1280" height="320" fill="url(#vignette)"/>
    </mask>
    <filter id="flickerGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0" result="blur">
        <animate attributeName="stdDeviation"
                 values="0;0;20;12;5;0"
                 keyTimes="0;0.555;0.66;0.77;0.88;1"
                 dur="4.5s"
                 fill="freeze"/>
      </feGaussianBlur>
      <feFlood flood-color="#ffffff" flood-opacity="1" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in" result="whiteGlow"/>
      <feMerge>
        <feMergeNode in="whiteGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>

  <text filter="url(#flickerGlow)"
        x="640" y="158" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="92" font-weight="600"
        fill="url(#title)" letter-spacing="-3"
        opacity="0">douglas<animate attributeName="opacity"
             values="0;1;0;0;1;0;1;0;0;1;0;1;0;1;1;1"
             keyTimes="0;0.022;0.044;0.088;0.111;0.133;0.166;0.2;0.244;0.288;0.333;0.388;0.444;0.555;0.622;1"
             dur="4.5s"
             calcMode="discrete"
             fill="freeze"/></text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="4s" fill="freeze"/>
    <text x="640" y="200" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
          font-size="13" fill="#9ca3af" letter-spacing="6">
      fullstack &#xb7; 3d &#xb7; self-host
    </text>
  </g>

  <g opacity="0" transform="translate(640 240)">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="4.7s" fill="freeze"/>

    <g transform="translate(-185 0)">
      <rect width="120" height="28" rx="14"
            fill="#ffffff" fill-opacity="0.04"
            stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
      <text x="60" y="19" text-anchor="middle"
            font-family="-apple-system,system-ui,sans-serif" font-size="12"
            fill="#d1d5db" letter-spacing="0.4">self-hosted</text>
    </g>

    <g transform="translate(-60 0)">
      <rect width="120" height="28" rx="14"
            fill="#ffffff" fill-opacity="0.04"
            stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
      <text x="60" y="19" text-anchor="middle"
            font-family="-apple-system,system-ui,sans-serif" font-size="12"
            fill="#d1d5db" letter-spacing="0.4">open source</text>
    </g>

    <g transform="translate(65 0)">
      <rect width="120" height="28" rx="14"
            fill="#ffffff" fill-opacity="0.04"
            stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
      <text x="60" y="19" text-anchor="middle"
            font-family="-apple-system,system-ui,sans-serif" font-size="12"
            fill="#d1d5db" letter-spacing="0.4">brasil</text>
    </g>
  </g>
</svg>
