<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 55" width="240" height="55">
  <defs>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="btnClip">
      <rect x="2" y="2" width="236" height="51" rx="25.5"/>
    </clipPath>
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="236" height="51" rx="25.5" fill="url(#btnBg)"/>

  <rect x="2" y="2" width="236" height="51" rx="25.5"
        fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <g clip-path="url(#btnClip)">
    <ellipse cx="120" cy="27.5" rx="80" ry="22" fill="url(#innerGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <animate attributeName="cx" values="90;150;90" dur="6s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    </ellipse>
  </g>

  <rect x="2" y="2" width="236" height="51" rx="25.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"
        stroke-linecap="round" pathLength="100"
        stroke-dasharray="18 82" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset"
             values="0;-100" dur="3.5s"
             calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.6 1"
             repeatCount="indefinite"/>
  </rect>

  <text x="120" y="34" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="13" font-weight="500"
        fill="#e5e7eb" letter-spacing="0.3">
    twitter &#xb7; @dgolaus
  </text>
</svg>
