      </path>
    </g>

    <text x="22" y="38"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
          font-size="11" font-weight="500" letter-spacing="2.8" fill="#fca5a5">&#x25B8; CRAFT MATTERS</text>

    <text x="22" y="78"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
          font-size="22" font-weight="500" letter-spacing="-0.5" fill="#fef2f2">aten&#xe7;&#xe3;o aos detalhes</text>
