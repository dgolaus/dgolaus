<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <pattern id="scan" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="#ffffff" fill-opacity="0.015"/>
    </pattern>

    <clipPath id="cp_coisas">
      <rect x="30" y="100" width="0" height="40">
        <set attributeName="width" to="24"  begin="0.50s"/>
        <set attributeName="width" to="46"  begin="0.60s"/>
        <set attributeName="width" to="68"  begin="0.70s"/>
        <set attributeName="width" to="90"  begin="0.80s"/>
        <set attributeName="width" to="112" begin="0.90s"/>
        <set attributeName="width" to="134" begin="1.00s"/>
        <set attributeName="width" to="156" begin="1.10s"/>
        <set attributeName="width" to="178" begin="1.20s"/>
        <set attributeName="width" to="200" begin="1.30s"/>
        <set attributeName="width" to="222" begin="1.40s"/>
      </rect>
    </clipPath>
    <clipPath id="cp_importam">
      <rect x="30" y="142" width="0" height="40">
        <set attributeName="width" to="24"  begin="1.60s"/>
        <set attributeName="width" to="46"  begin="1.70s"/>
        <set attributeName="width" to="68"  begin="1.80s"/>
        <set attributeName="width" to="90"  begin="1.90s"/>
        <set attributeName="width" to="112" begin="2.00s"/>
        <set attributeName="width" to="134" begin="2.10s"/>
        <set attributeName="width" to="156" begin="2.20s"/>
        <set attributeName="width" to="178" begin="2.30s"/>
        <set attributeName="width" to="200" begin="2.40s"/>
      </rect>
    </clipPath>
  </defs>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">

    <g>
      <rect x="0" y="0" width="760" height="240" rx="10" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="760" height="240" rx="10" fill="url(#scan)"/>
      <rect x="0" y="0" width="760" height="240" rx="10" fill="none"
            stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

      <rect x="0" y="0" width="760" height="28" fill="#0a0a0a"/>
      <path d="M 0 28 L 760 28" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

      <circle cx="16" cy="14" r="4.5" fill="#ff5f57"/>
      <circle cx="32" cy="14" r="4.5" fill="#ffbd2e"/>
      <circle cx="48" cy="14" r="4.5" fill="#28c93f"/>
      <text x="380" y="18" text-anchor="middle"
            font-size="11" fill="#6b7280" letter-spacing="0.5">~/about.md</text>

      <text x="32" y="74" font-size="13" fill="#ffffff">&gt;</text>
      <text x="50" y="74" font-size="13" fill="#9ca3af" letter-spacing="1.5">sobre</text>

      <g clip-path="url(#cp_coisas)">
        <text x="32" y="130" font-size="38" font-weight="600" fill="#f5f5f5" letter-spacing="-1">coisas que</text>
      </g>
      <g clip-path="url(#cp_importam)">
        <text x="32" y="172" font-size="38" font-weight="600" fill="#f5f5f5" letter-spacing="-1">importam.</text>
      </g>

      <text x="32" y="215" font-size="13" fill="#ffffff">$</text>
      <text x="48" y="215" font-size="13" fill="#9ca3af" letter-spacing="0.3">aberto a colabora&#xe7;&#xf5;es</text>
    </g>

    <g transform="translate(780 0)">
      <rect x="0" y="0" width="500" height="110" rx="10" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="500" height="110" rx="10" fill="url(#scan)"/>
      <rect x="0" y="0" width="500" height="110" rx="10" fill="none"
            stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

      <rect x="0" y="0" width="500" height="22" fill="#0a0a0a"/>
      <path d="M 0 22 L 500 22" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
      <text x="14" y="15" font-size="10" fill="#6b7280" letter-spacing="0.5">$ status</text>

      <text x="22" y="52" font-size="11" fill="#ffffff">&gt;</text>
      <text x="38" y="52" font-size="11" fill="#9ca3af" letter-spacing="1.5">sempre aprendendo</text>

      <text x="22" y="80" font-size="20" font-weight="500" fill="#f5f5f5" letter-spacing="-0.3">fullstack em forma&#xe7;&#xe3;o</text>

      <g transform="translate(22 92)">
        <rect width="200" height="6" rx="1" fill="#1a1a1a" stroke="#ffffff" stroke-opacity="0.06"/>
        <rect width="0" height="6" rx="1" fill="#ffffff" fill-opacity="0.85">
          <animate attributeName="width"
            values="0;14;38;42;78;82;104;108;126;130"
            keyTimes="0;0.03;0.12;0.32;0.38;0.55;0.62;0.82;0.92;1"
            dur="5s"
            begin="0.5s"
            fill="freeze"/>
        </rect>
        <text x="210" y="6" font-size="9" fill="#6b7280">65%</text>
      </g>
    </g>

    <g transform="translate(780 130)">
      <rect x="0" y="0" width="500" height="110" rx="10" fill="url(#cardBg)"/>
      <rect x="0" y="0" width="500" height="110" rx="10" fill="url(#scan)"/>
      <rect x="0" y="0" width="500" height="110" rx="10" fill="none"
            stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

      <rect x="0" y="0" width="500" height="22" fill="#0a0a0a"/>
      <path d="M 0 22 L 500 22" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
      <text x="14" y="15" font-size="10" fill="#6b7280" letter-spacing="0.5">$ values</text>

      <text x="22" y="52" font-size="11" fill="#ffffff">&gt;</text>
      <text x="38" y="52" font-size="11" fill="#9ca3af" letter-spacing="1.5">craft matters</text>

      <text x="22" y="80" font-size="20" font-weight="500" fill="#f5f5f5" letter-spacing="-0.3">aten&#xe7;&#xe3;o aos detalhes</text>

      <g transform="translate(440 65)" fill="#ffffff" font-size="14">
        <text x="0" y="0" letter-spacing="2" opacity="0.35">[</text>
        <text x="14" y="0" letter-spacing="2" opacity="0.75">*</text>
        <text x="28" y="0" letter-spacing="2" opacity="0.95">]</text>
      </g>
    </g>

  </g>
</svg>
