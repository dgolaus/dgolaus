    <text x="22" y="38"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
          font-size="11" font-weight="500" letter-spacing="2.8" fill="#fca5a5">&#x25B8; SEMPRE APRENDENDO</text>

    <text x="22" y="78"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
          font-size="22" font-weight="500" letter-spacing="-0.5" fill="#fef2f2">fullstack em forma&#xe7;&#xe3;o</text>

    <g transform="translate(440 55)">
      <rect x="-32" y="2" width="6" height="16" rx="1" fill="#ef4444" fill-opacity="0.45"/>
      <rect x="-22" y="-8" width="6" height="26" rx="1" fill="#ef4444" fill-opacity="0.7"/>
      <rect x="-12" y="-18" width="6" height="36" rx="1" fill="#ef4444"/>
      <rect x="-2" y="-28" width="6" height="46" rx="1" fill="#fca5a5">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
      </rect>
    </g>
