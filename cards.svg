      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#fff" fill-opacity="0.005"/>
      <circle cx="1.5" cy="1.5" r="0.3" fill="#fff" fill-opacity="0.02"/>
    </pattern>
  </defs>

  <g>
    <rect x="0" y="0" width="760" height="240" rx="20" fill="#0a0a0a"/>
    <rect x="0" y="0" width="760" height="240" rx="20" fill="url(#aboutGlow)"/>
    <rect x="0" y="0" width="760" height="240" rx="20" fill="url(#aboutSheen)"/>
    <rect x="0" y="0" width="760" height="240" rx="20" fill="url(#grain)"/>
    <rect x="0" y="0" width="760" height="240" rx="20" fill="none"
          stroke="#ef4444" stroke-opacity="0.20" stroke-width="1"/>

    <text x="40" y="55"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
          font-size="11" font-weight="500" letter-spacing="2.8" fill="#fca5a5">&#x25B8; SOBRE</text>

    <text x="40" y="125"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
          font-size="44" font-weight="600" letter-spacing="-1.5" fill="#fef2f2">coisas que</text>
    <text x="40" y="172"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
          font-size="44" font-weight="600" letter-spacing="-1.5" fill="#fef2f2">importam.</text>

    <text x="40" y="215"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
          font-size="13" fill="#f87171" letter-spacing="0.5">&#x2192; aberto a colabora&#xe7;&#xf5;es_</text>
  </g>

  <g transform="translate(780 0)">
    <rect x="0" y="0" width="500" height="110" rx="16" fill="#0a0a0a"/>
    <rect x="0" y="0" width="500" height="110" rx="16" fill="url(#learnGrad)"/>
    <rect x="0" y="0" width="500" height="110" rx="16" fill="url(#grain)"/>
    <rect x="0" y="0" width="500" height="110" rx="16" fill="none"
