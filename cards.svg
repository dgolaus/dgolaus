<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240">
  <defs>
    <radialGradient id="aboutGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aboutSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="learnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="craftStar" cx="50%" cy="50%" r="50%">
