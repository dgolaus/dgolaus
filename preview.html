<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>preview · dgolaus/README.md</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #0d1117;
    --panel-border: #30363d;
    --header: #161b22;
    --text: #e6edf3;
    --muted: #7d8590;
    --hr: #21262d;
    --accent: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #010409;
    border-bottom: 1px solid var(--panel-border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .toolbar h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }
  .toolbar h1 strong { color: var(--text); font-weight: 600; }
  .toggle {
    margin-left: auto;
    display: inline-flex;
    background: #21262d;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
  }
  .toggle button {
    background: transparent;
    color: var(--text);
    border: 0;
    padding: 6px 14px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    border-right: 1px solid var(--panel-border);
  }
  .toggle button:last-child { border-right: 0; }
  .toggle button.active {
    background: var(--accent);
    color: #0a0a0a;
    font-weight: 600;
  }
  .reload {
    background: #21262d;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 14px;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
  }
  .page {
    max-width: 1012px;
    margin: 24px auto;
    padding: 0 24px;
  }
  .readme-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
  }
  .readme-head {
    background: var(--header);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px 16px;
    color: var(--muted);
    font-size: 14px;
  }
  .readme-head strong { color: var(--text); font-weight: 600; }
  .readme-body {
    padding: 32px 32px 24px;
    line-height: 1.5;
  }
  .readme-body img {
    max-width: 100%;
    height: auto;
    display: inline-block;
  }
  .center { text-align: center; }
  hr {
    border: 0;
    border-top: 1px solid var(--hr);
    margin: 24px 0;
  }
  h3 { margin: 24px 0 16px; font-size: 20px; font-weight: 600; }
  .connect-row { text-align: center; }
  .connect-row a { text-decoration: none; }
  .connect-row a + a { margin-left: 4px; }
  sub { color: var(--muted); font-size: 12px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .term-label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #9ca3af;
    font-size: 13px;
    margin: 16px 0 12px;
  }
  .term-label .prompt { color: #fff; margin-right: 6px; }

  body[data-mode="live"] .minimal { display: none; }
  body[data-mode="minimal"] .live { display: none; }
</style>
</head>
<body data-mode="live">

<div class="toolbar">
  <h1><strong>preview</strong> &middot; dgolaus/README.md</h1>
  <button class="reload" type="button" onclick="location.reload()">replay &#x21bb;</button>
  <div class="toggle">
    <button data-mode="live" type="button" class="active">atual &middot; terminal</button>
    <button data-mode="minimal" type="button">dark &middot; minimal</button>
  </div>
</div>

<div class="page">
  <div class="readme-panel">
    <div class="readme-head">dgolaus / <strong>README.md</strong></div>
    <div class="readme-body">

      <!-- LIVE: the SVGs at the repo root, i.e. what the profile shows now -->
      <div class="live">
        <div class="center">
          <img src="./banner.svg" alt="banner" width="100%">
          <br><br>
          <img src="./cards.svg" alt="cards" width="100%">
        </div>
        <hr>
        <div class="center"><img src="./stack.svg" alt="stack"></div>
        <hr>
        <div class="term-label"><span class="prompt">$</span>find me online</div>
        <div class="connect-row">
          <a href="https://twitter.com/dgolaus"><img src="./btn-twitter.svg" alt="twitter"></a>
          <a href="https://instagram.com/dgolaus"><img src="./btn-instagram.svg" alt="instagram"></a>
          <a href="https://discord.com/users/gfxs0da"><img src="./btn-discord.svg" alt="discord"></a>
          <a href="https://rubiconstudios.io/"><img src="./btn-rubicon.svg" alt="rubicon"></a>
        </div>
        <hr>
        <div class="center"><sub class="mono">// made with luv in brazil</sub></div>
      </div>

      <!-- MINIMAL: grayscale variant kept around as an alternative -->
      <div class="minimal">
        <div class="center">
          <img src="./dark-minimal/banner.svg" alt="banner" width="100%">
          <br><br>
          <img src="https://readme-typing-svg.demolab.com/?font=Fira+Code&size=18&pause=1500&color=E5E7EB&center=true&vCenter=true&width=600&height=40&lines=building+things+from+pixel+to+vps;fullstack+em+forma%C3%A7%C3%A3o;3d+artist+%40+rubicon+games;open+source+enthusiast+%E2%9C%A6" alt="typing">
          <br><br>
          <img src="./dark-minimal/cards.svg" alt="cards" width="100%">
        </div>
        <hr>
        <h3>&#x25B8; stack</h3>
        <div class="center"><img src="./dark-minimal/stack.svg" alt="stack"></div>
        <hr>
        <h3>&#x25B8; connect</h3>
        <div class="connect-row">
          <a href="https://twitter.com/dgolaus"><img src="./dark-minimal/btn-twitter.svg" alt="twitter"></a>
          <a href="https://instagram.com/dgolaus"><img src="./dark-minimal/btn-instagram.svg" alt="instagram"></a>
          <a href="https://discord.com/users/gfxs0da"><img src="./dark-minimal/btn-discord.svg" alt="discord"></a>
          <a href="https://rubiconstudios.io/"><img src="./dark-minimal/btn-rubicon.svg" alt="rubicon"></a>
        </div>
        <hr>
        <div class="center"><sub>made with &#x26AB; in brazil</sub></div>
      </div>

    </div>
  </div>
</div>

<script>
  document.querySelectorAll('.toggle button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.body.dataset.mode = btn.dataset.mode;
      document.querySelectorAll('.toggle button').forEach(function (b) {
        b.classList.toggle('active', b.dataset.mode === btn.dataset.mode);
      });
    });
  });
</script>
</body>
</html>
