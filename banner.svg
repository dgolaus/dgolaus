<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <radialGradient id="amb1" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb2" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb3" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="topline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <mask id="gridMask">
      <rect width="1280" height="320" fill="white"/>
      <rect width="1280" height="320" fill="url(#vignette)"/>
    </mask>
  </defs>

  <rect width="1280" height="320" fill="#000"/>

  <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>

  <rect width="1280" height="320" fill="url(#amb1)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect width="1280" height="320" fill="url(#amb2)">
    <animate attributeName="opacity" values="1;0.6;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect width="1280" height="320" fill="url(#amb3)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="11s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="0" width="1280" height="1" fill="url(#topline)" opacity="0.6"/>
  <rect x="0" y="319" width="1280" height="1" fill="url(#topline)" opacity="0.4"/>

  <g opacity="0.55">
    <circle cx="160" cy="280" r="2" fill="#a855f7">
      <animate attributeName="cy" values="320;-20" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="280" r="1.5" fill="#c084fc">
      <animate attributeName="cy" values="320;-20" dur="11s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0;1;0" dur="11s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="480" cy="280" r="1" fill="#a855f7">
      <animate attributeName="cy" values="320;-20" dur="13s" repeatCount="indefinite" begin="5s"/>
      <animate attributeName="opacity" values="0;1;0" dur="13s" repeatCount="indefinite" begin="5s"/>
    </circle>
    <circle cx="800" cy="280" r="1.5" fill="#c084fc">
      <animate attributeName="cy" values="320;-20" dur="10s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle cx="960" cy="280" r="1" fill="#a855f7">
      <animate attributeName="cy" values="320;-20" dur="14s" repeatCount="indefinite" begin="6s"/>
      <animate attributeName="opacity" values="0;1;0" dur="14s" repeatCount="indefinite" begin="6s"/>
    </circle>
    <circle cx="1120" cy="280" r="1.5" fill="#c084fc">
      <animate attributeName="cy" values="320;-20" dur="12s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;1;0" dur="12s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.3s" fill="freeze"/>
    <text x="640" y="158" text-anchor="middle"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
          font-size="92" font-weight="600"
          fill="url(#title)" letter-spacing="-3">dgolaus</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.9s" fill="freeze"/>
    <text x="640" y="200" text-anchor="middle"
          font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
          font-size="13" fill="#a78bfa" letter-spacing="6">
      fullstack &#xb7; 3d &#xb7; self-host
    </text>
  </g>

  <g opacity="0" transform="translate(640 240)">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.5s" fill="freeze"/>

    <g transform="translate(-185 0)">
      <rect width="120" height="28" rx="14"
            fill="rgba(168,85,247,0.10)"
            stroke="rgba(168,85,247,0.45)" stroke-width="1"/>
      <text x="60" y="19" text-anchor="middle"
            font-family="-apple-system,system-ui,sans-serif" font-size="12"
            fill="#c084fc" letter-spacing="0.4">self-hosted</text>
    </g>

    <g transform="translate(-60 0)">
      <rect width="120" height="28" rx="14"
            fill="rgba(168,85,247,0.10)"
            stroke="rgba(168,85,247,0.45)" stroke-width="1"/>
      <text x="60" y="19" text-anchor="middle"
            font-family="-apple-system,system-ui,sans-serif" font-size="12"
            fill="#c084fc" letter-spacing="0.4">open source</text>
    </g>

    <g transform="translate(65 0)">
      <rect width="120" height="28" rx="14"
            fill="rgba(168,85,247,0.10)"
            stroke="rgba(168,85,247,0.45)" stroke-width="1"/>
      <text x="60" y="19" text-anchor="middle"
            font-family="-apple-system,system-ui,sans-serif" font-size="12"
            fill="#c084fc" letter-spacing="0.4">brasil</text>
    </g>
  </g>
</svg>
